[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentio-field"
version = "0.1.0"
description = "A live, linear 2D scalar field driven by luminance measurements"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "PySide6>=6.8,<7"]

[project.scripts]
sentio = "sentio.__main__:main"

[tool.setuptools.packages.find]
include = ["sentio*"]
